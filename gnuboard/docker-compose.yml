services:
  web:
    build: ./docker/php
    ports:
      - "8080:80"
    volumes:
      - ./runtime:/var/www/html
    depends_on:
      - db
    environment:
      TZ: Asia/Seoul

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: tbc_root
      MYSQL_DATABASE: gnuboard
      MYSQL_USER: gnuboard
      MYSQL_PASSWORD: gnuboard
      TZ: Asia/Seoul
    volumes:
      - gnuboard_mysql:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: gnuboard
      PMA_PASSWORD: gnuboard
    depends_on:
      - db

volumes:
  gnuboard_mysql:
